<?xml version="1.0" encoding="UTF-8"?>
<!-- tree_b - Round canopy / broadleaf tree -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">

  <!-- Tree trunk and canopy -->
  <g stroke="#E8F1FA" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <path d="M35,118 C36,90 37,65 38,42 L42,42 C43,65 44,90 45,118"/>

    <!-- Ground line at base -->
    <line x1="30" y1="118" x2="50" y2="118" stroke-width="2"/>

    <!-- Main canopy (bubbly circles cluster) -->
    <circle cx="40" cy="25" r="22"/>
    <circle cx="30" cy="35" r="16"/>
    <circle cx="50" cy="33" r="17"/>
    <circle cx="25" cy="48" r="12"/>
    <circle cx="55" cy="46" r="13"/>

    <!-- Canopy inner detail lines -->
    <g stroke-width="1.5">
      <path d="M22,25 C28,22 35,20 40,22"/>
      <path d="M58,25 C52,22 45,20 40,22"/>
      <path d="M25,38 C30,35 36,33 40,35"/>
      <path d="M55,36 C50,33 44,31 40,35"/>
      <path d="M30,44 C34,42 37,40 40,42"/>
    </g>

    <!-- Branch details -->
    <g stroke-width="1.5">
      <path d="M38,42 L28,30"/>
      <path d="M42,42 L52,32"/>
      <path d="M39,50 L32,44"/>
    </g>

    <!-- Small leaf clusters -->
    <circle cx="38" cy="18" r="6" stroke-width="1.5"/>
    <circle cx="44" cy="20" r="7" stroke-width="1.5"/>
  </g>

</svg>
