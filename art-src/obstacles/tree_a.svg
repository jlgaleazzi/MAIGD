<?xml version="1.0" encoding="UTF-8"?>
<!-- tree_a - Tall pine / fir tree -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120" width="80" height="120">

  <!-- Tree trunk and foliage layers -->
  <g stroke="#E8F1FA" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trunk -->
    <line x1="40" y1="50" x2="40" y2="118" stroke-width="3"/>

    <!-- Base roots -->
    <g stroke-width="2">
      <path d="M40,118 L30,120"/>
      <path d="M40,118 L50,120"/>
    </g>

    <!-- Lower foliage layer (wide triangle) -->
    <path d="M15,70 L40,40 L65,70 C55,75 45,78 40,82
             C35,78 25,75 15,70 Z" stroke-width="2.5"/>

    <!-- Middle foliage layer -->
    <path d="M20,52 L40,25 L60,52 C52,56 45,59 40,62
             C35,59 28,56 20,52 Z" stroke-width="2.5"/>

    <!-- Upper foliage layer -->
    <path d="M27,38 L40,12 L53,38 C47,41 43,43 40,45
             C37,43 33,41 27,38 Z" stroke-width="2"/>

    <!-- Inner branch details (lower layer) -->
    <g stroke-width="1.5">
      <path d="M30,65 L38,60"/>
      <path d="M50,65 L42,60"/>
      <path d="M33,72 L39,68"/>
      <path d="M47,72 L41,68"/>
    </g>

    <!-- Inner branch details (middle layer) -->
    <g stroke-width="1.5">
      <path d="M30,48 L37,43"/>
      <path d="M50,48 L43,43"/>
    </g>

    <!-- Top spur -->
    <line x1="40" y1="12" x2="40" y2="6" stroke-width="1.5"/>
  </g>

</svg>
