<?xml version="1.0" encoding="UTF-8"?>
<!-- tree_a: tall fir, technical-illustration trunk and branch whorls, hatched canopy -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="80" height="120" viewBox="0 0 80 120">
  <defs>
    <pattern id="ht" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2.4" stroke="#E8F1FA" stroke-width="0.5" opacity="0.7"/>
    </pattern>
    <clipPath id="crown">
      <path d="M40,6 L33,22 L36,21.5 L26,38 L31,37.5 L19,57 L25,56.5 L12,78 L20,77 L9,92 Q40,98 71,92 L60,77 L68,78 L55,56.5 L61,57 L49,37.5 L54,38 L44,21.5 L47,22 Z"/>
    </clipPath>
    <!-- one whorl of branches: a drooping limb pair with needle ticks -->
    <g id="whorl">
      <path d="M0,0 Q-10,2 -20,8 M0,0 Q10,2 20,8" stroke-width="0.75"/>
      <path d="M-5,1 L-7,4 M-10,2.5 L-12,5.6 M-15,4.6 L-17,7.6 M5,1 L7,4 M10,2.5 L12,5.6 M15,4.6 L17,7.6" stroke-width="0.5" opacity="0.75"/>
      <path d="M-6,1.2 L-8,-1 M-12,3 L-14,0.6 M6,1.2 L8,-1 M12,3 L14,0.6" stroke-width="0.5" opacity="0.6"/>
    </g>
  </defs>

  <g fill="none" stroke="#E8F1FA" stroke-linecap="round" stroke-linejoin="round">
    <!-- shading hatch on the right half of the crown -->
    <rect x="42" y="4" width="32" height="96" fill="url(#ht)" stroke="none" clip-path="url(#crown)"/>

    <!-- hidden trunk centreline and leader inside the crown -->
    <path d="M40,10 L40,92" stroke-width="0.5" stroke-dasharray="3 1.5" opacity="0.6"/>
    <path d="M38.6,92 L39.5,20 M41.4,92 L40.5,20" stroke-width="0.5" opacity="0.8"/>

    <!-- branch whorls, scaled per tier -->
    <use xlink:href="#whorl" transform="translate(40,19.2) scale(0.35)"/>
    <use xlink:href="#whorl" transform="translate(40,32.4) scale(0.7)"/>
    <use xlink:href="#whorl" transform="translate(40,48.6) scale(1.05)"/>
    <use xlink:href="#whorl" transform="translate(40,66.8) scale(1.4)"/>
    <use xlink:href="#whorl" transform="translate(40,79.6) scale(1.55)"/>

    <!-- crown outline -->
    <path d="M40,6 L33,22 L36,21.5 L26,38 L31,37.5 L19,57 L25,56.5 L12,78 L20,77 L9,92 Q40,98 71,92 L60,77 L68,78 L55,56.5 L61,57 L49,37.5 L54,38 L44,21.5 L47,22 Z" stroke-width="1.25"/>
    <path d="M40,6 L40,4.6" stroke-width="0.75"/>

    <!-- trunk with root flare and bark lines -->
    <path d="M37,95 L36.5,108 Q36,111 32,113 M43,95 L43.5,108 Q44,111 48,113" stroke-width="1.25"/>
    <path d="M38.5,97 L38.4,104 M40,96 L40,99 M40,102 L40,109 M41.6,98 L41.7,106" stroke-width="0.5" opacity="0.75"/>
    <path d="M43,96 L43.5,108 Q44,110 46,111.5 L43.5,111.5 Z" fill="url(#ht)" stroke="none"/>
    <path d="M38,110 L35,113 M42,110 L45,113" stroke-width="0.5" opacity="0.8"/>

    <!-- ground line with grass ticks -->
    <path d="M14,113 L66,113" stroke-width="1.25"/>
    <path d="M20,113 L19,111 M26,113 L27,111 M54,113 L53,111 M60,113 L61,111" stroke-width="0.5" opacity="0.7"/>

    <!-- small label mark "A" -->
    <path d="M70,104 L72,99 L74,104 M70.8,102 L73.2,102" stroke-width="0.5" opacity="0.8"/>
  </g>
</svg>
