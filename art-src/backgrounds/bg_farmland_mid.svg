          stroke-width="1.5"/>
    <path d="M-20,682 C102,612 300,593 502,622 C700,652 898,642 1098,612 C1298,582 1498,592 1698,622 C1898,652 1982,642 2000,632"
          stroke-width="1.0" opacity="0.5"/>
    <path d="M-20,678 C98,608 298,588 498,618 C698,648 898,638 1098,608 C1298,578 1498,588 1698,618 C1898,648 1978,638 2000,628"
          stroke-width="1.0" opacity="0.5"/>
    <!-- light hatching on hill faces -->
    <g opacity="0.25">
      <line x1="100" y1="650" x2="120" y2="670"/>
      <line x1="200" y1="630" x2="225" y2="660"/>
      <line x1="350" y1="610" x2="380" y2="645"/>
      <line x1="550" y1="640" x2="575" y2="668"/>
      <line x1="700" y1="648" x2="720" y2="670"/>
      <line x1="850" y1="635" x2="875" y2="665"/>
      <line x1="1000" y1="625" x2="1025" y2="658"/>
      <line x1="1150" y1="632" x2="1175" y2="662"/>
      <line x1="1300" y1="640" x2="1320" y2="665"/>
      <line x1="1450" y1="618" x2="1475" y2="650"/>
      <line x1="1600" y1="635" x2="1620" y2="665"/>
    </g>
  </g>

  <!-- Hill group 2: mid-swell, base ~y=710 -->
  <g id="hill2" stroke="#9DB4CC" fill="none" opacity="0.65">
    <path d="M-20,720 C80,670 250,640 420,660 C600,680 780,710 950,700 C1100,690 1250,660 1420,680 C1580,700 1750,720 1900,710 C1960,705 1990,700 2000,695"
          stroke-width="1.5"/>
    <path d="M-20,723 C82,672 250,642 422,662 C600,683 778,712 948,702 C1098,692 1248,662 1418,682 C1578,702 1748,722 1898,712 C1958,707 1988,702 2000,698"
