  <!-- ===== Tree lines along hill crests (more distinct on closer hills) ===== -->
  <g id="trees" stroke="#9DB4CC" fill="none" opacity="0.75">
    <!-- Trees on Hill 1 crest (further, smaller) -->
    <!-- Cluster around x=300 -->
    <path d="M280,630 L285,600 L290,630 M283,600 L290,590 M282,605 L288,595" stroke-width="1.2"/>
    <path d="M280,630 L284,602 L290,630 M283,600 L289,592" stroke-width="0.8" opacity="0.5"/>
    <!-- Cluster around x=700 -->
    <path d="M680,648 L685,615 L690,635 M688,615 L696,605 M686,620 L692,610" stroke-width="1.2"/>
    <path d="M680,648 L684,618 L690,638 M688,615 L694,608" stroke-width="0.8" opacity="0.5"/>
    <!-- Cluster around x=1200 -->
    <path d="M1180,625 L1185,595 L1190,615 M1188,595 L1196,585" stroke-width="1.2"/>
    <path d="M1180,625 L1184,597 L1190,618" stroke-width="0.8" opacity="0.5"/>
    <!-- Cluster around x=1600 -->
    <path d="M1580,630 L1585,600 L1590,620 M1588,600 L1596,590" stroke-width="1.2"/>
    <path d="M1580,630 L1584,602 L1590,622" stroke-width="0.8" opacity="0.5"/>

    <!-- Trees on Hill 2 crest (closer, larger) -->
    <!-- Cluster around x=150 -->
    <path d="M130,685 L140,640 L150,670 L155,645 L160,665" stroke-width="1.5"/>
    <path d="M135,640 L142,630 M150,648 L158,638 M155,646 L162,635" stroke-width="1.0" opacity="0.6"/>
    <!-- Cluster around x=500 -->
    <path d="M470,695 L480,645 L490,675 L498,650 L508,670" stroke-width="1.5"/>
    <path d="M475,645 L482,635 M490,652 L498,642 M498,650 L505,640" stroke-width="1.0" opacity="0.6"/>
    <!-- Cluster around x=900 -->
    <path d="M870,708 L880,655 L890,685 L898,660 L908,680" stroke-width="1.5"/>
    <path d="M875,655 L882,645 M890,662 L898,652 M898,660 L905,650" stroke-width="1.0" opacity="0.6"/>
    <!-- Cluster around x=1300 -->
    <path d="M1270,698 L1280,648 L1290,678 L1298,652 L1308,672" stroke-width="1.5"/>
    <path d="M1275,648 L1282,638 M1290,655 L1298,645 M1298,652 L1305,642" stroke-width="1.0" opacity="0.6"/>
    <!-- Cluster around x=1700 -->
    <path d="M1680,715 L1690,665 L1700,695 L1708,670 L1718,690" stroke-width="1.5"/>
    <path d="M1685,665 L1692,655 M1700,672 L1708,662 M1708,670 L1715,660" stroke-width="1.0" opacity="0.6"/>

    <!-- Trees on Hill 3 crest (closest, largest) -->
    <!-- Cluster around x=350 -->
    <path d="M320,748 L335,695 L350,730 L358,705 L370,728" stroke-width="1.8"/>
    <path d="M325,695 L335,682 M350,700 L360,688 M358,698 L366,685" stroke-width="1.2" opacity="0.6"/>
    <!-- Cluster around x=750 -->
    <path d="M720,755 L735,702 L750,735 L758,710 L770,732" stroke-width="1.8"/>
    <path d="M725,702 L735,690 M750,708 L760,696 M758,705 L766,692" stroke-width="1.2" opacity="0.6"/>
    <!-- Cluster around x=1150 -->
    <path d="M1120,748 L1135,695 L1150,728 L1158,703 L1170,725" stroke-width="1.8"/>
    <path d="M1125,695 L1135,682 M1150,700 L1160,688 M1158,698 L1166,685" stroke-width="1.2" opacity="0.6"/>
    <!-- Cluster around x=1550 -->
    <path d="M1520,742 L1535,690 L1550,725 L1558,700 L1570,722" stroke-width="1.8"/>
    <path d="M1525,690 L1535,678 M1550,695 L1560,682 M1558,692 L1566,680" stroke-width="1.2" opacity="0.6"/>

    <!-- Lone/distant trees scattered on crests -->
    <path d="M450,660 L453,635 L456,655" stroke-width="1.0" opacity="0.5"/>
    <path d="M620,705 L624,678 L628,700" stroke-width="1.0" opacity="0.5"/>
    <path d="M1050,720 L1053,695 L1056,715" stroke-width="1.0" opacity="0.5"/>
    <path d="M1400,725 L1404,700 L1408,722" stroke-width="1.0" opacity="0.5"/>
    <path d="M1830,735 L1834,710 L1838,732" stroke-width="1.0" opacity="0.5"/>
