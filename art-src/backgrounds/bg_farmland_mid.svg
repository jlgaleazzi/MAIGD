<?xml version="1.0" encoding="UTF-8"?>
<!-- bg_farmland_mid.svg — Farmland mid-parallax layer: rolling hills + tree lines -->
<!-- Pencil strokes on blueprint-blue paper. Tileable left↔right. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">

  <!-- ===== Rolling hills (main silhouettes) — 3 contours each ===== -->

  <!-- Hill group 1: wide low swell, base ~y=650 -->
