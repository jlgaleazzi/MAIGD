  <!-- ===== Fence rows along hills (subtle linear elements) ===== -->
  <g id="fences" stroke="#9DB4CC" fill="none" opacity="0.5">
    <!-- Fence on hill 2 near x=400-600 -->
    <line x1="380" y1="705" x2="580" y2="710" stroke-width="0.8"/>
    <line x1="400" y1="698" x2="402" y2="710"/>
    <line x1="440" y1="701" x2="442" y2="713"/>
    <line x1="480" y1="704" x2="482" y2="716"/>
    <line x1="520" y1="707" x2="522" y2="719"/>
    <line x1="560" y1="709" x2="562" y2="721"/>

    <!-- Fence on hill 3 near x=1000-1300 -->
    <line x1="1000" y1="745" x2="1300" y2="740" stroke-width="0.8"/>
    <line x1="1030" y1="738" x2="1032" y2="750"/>
    <line x1="1080" y1="741" x2="1082" y2="753"/>
    <line x1="1130" y1="743" x2="1132" y2="755"/>
    <line x1="1180" y1="742" x2="1182" y2="754"/>
    <line x1="1230" y1="741" x2="1232" y2="753"/>
  </g>

  <!-- ===== Very faint hatching bands (shading for depth) ===== -->
  <defs>
    <pattern id="hatch-mid" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#9DB4CC" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Hatching patch on hill 2 (mid-ground shade) -->
  <g opacity="0.3">
    <path d="M300,680 Q400,660 500,670 L500,720 Q400,730 300,720 Z" fill="url(#hatch-mid)" stroke="none"/>
  </g>

  <!-- Hatching patch on hill 3 -->
  <g opacity="0.2">
    <path d="M800,745 Q950,720 1100,735 L1100,780 Q950,795 800,785 Z" fill="url(#hatch-mid)" stroke="none"/>
  </g>

</svg>
