      <line x1="150" y1="695" x2="175" y2="720"/>
      <line x1="350" y1="685" x2="378" y2="718"/>
      <line x1="550" y1="690" x2="575" y2="718"/>
      <line x1="700" y1="700" x2="720" y2="725"/>
      <line x1="850" y1="695" x2="875" y2="723"/>
      <line x1="1050" y1="700" x2="1072" y2="725"/>
      <line x1="1200" y1="690" x2="1225" y2="718"/>
      <line x1="1400" y1="685" x2="1425" y2="715"/>
      <line x1="1600" y1="705" x2="1620" y2="730"/>
    </g>
  </g>

  <!-- Hill group 3: gentle swell, base ~y=780 -->
