<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="hatch-far" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#9DB4CC" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- paper fill + grid -->
  <rect width="1920" height="1080" fill="#0F2A4A"/>
  <rect width="1920" height="1080" fill="url(#grid-far)" opacity="0.5">
    <defs>
      <pattern id="grid-far" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 L 0 32" fill="none" stroke="#1C3F66" stroke-width="0.5"/>
      </pattern>
    </defs>
  </rect>
  <!-- distant fortifications (trench lines, bunkers as simple outlines) -->
  <g stroke="#9DB4CC" stroke-width="1.2" fill="none" opacity="0.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- trench line: must tile horizontally (y at x=0 = y at x=1920) -->
    <path d="M 0 680 Q 160 640 320 670 Q 480 700 640 660 Q 800 620 960 650
             Q 1120 680 1280 640 Q 1440 600 1600 640 Q 1760 680 1920 680"/>
    <!-- second trench line -->
    <path d="M 0 720 Q 200 700 400 720 Q 600 740 800 710 Q 1000 680 1200 700
             Q 1400 720 1600 690 Q 1800 660 1920 720"/>
    <!-- distant bunker shapes -->
    <rect x="300" y="580" width="60" height="40" rx="4" opacity="0.4"/>
    <line x1="330" y1="540" x2="330" y2="580" opacity="0.4"/>
    <rect x="900" y="560" width="80" height="50" rx="6" opacity="0.35"/>
    <rect x="1500" y="590" width="50" height="35" rx="4" opacity="0.3"/>
  </g>
  <!-- pencil-overlap for depth (offset traces) -->
  <g stroke="#9DB4CC" stroke-width="1" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M 0 680 Q 160 642 320 672 Q 480 702 640 662 Q 800 622 960 652
             Q 1120 682 1280 642 Q 1440 602 1600 642 Q 1760 682 1920 680"/>
    <path d="M 0 680 Q 160 638 320 668 Q 480 698 640 658 Q 800 618 960 648
             Q 1120 678 1280 638 Q 1440 598 1600 638 Q 1760 678 1920 680"/>
  </g>
  <!-- smoke columns (distant) -->
  <g stroke="#9DB4CC" fill="none" opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M 400 560 Q 420 520 410 480 Q 400 440 430 400"/>
    <path d="M 1100 540 Q 1120 500 1110 460 Q 1090 420 1130 380"/>
    <path d="M 1700 550 Q 1720 510 1710 470 Q 1690 430 1720 390"/>
  </g>
</svg>
