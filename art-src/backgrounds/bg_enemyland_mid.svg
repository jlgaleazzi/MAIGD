<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="hatch-el-mid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9DB4CC" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0F2A4A"/>
  <rect width="1920" height="1080" fill="url(#grid-el-mid)" opacity="0.5">
    <defs>
      <pattern id="grid-el-mid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 L 0 32" fill="none" stroke="#1C3F66" stroke-width="0.5"/>
      </pattern>
    </defs>
  </rect>
  <!-- factories and smokestacks -->
  <g stroke="#9DB4CC" fill="url(#hatch-el-mid)" opacity="0.65" stroke-linecap="round">
    <rect x="200" y="700" width="120" height="100"/>
    <rect x="500" y="680" width="140" height="120"/>
    <rect x="850" y="710" width="100" height="90"/>
    <rect x="1100" y="690" width="130" height="110"/>
    <rect x="1450" y="720" width="110" height="80"/>
  </g>
  <g stroke="#9DB4CC" fill="none" opacity="0.7" stroke-width="1.5" stroke-linecap="round">
    <!-- smokestacks -->
    <rect x="230" y="620" width="15" height="80"/>
    <rect x="540" y="600" width="18" height="80"/>
    <rect x="580" y="620" width="12" height="60"/>
    <rect x="900" y="650" width="14" height="60"/>
    <rect x="1150" y="630" width="16" height="60"/>
    <rect x="1480" y="660" width="12" height="60"/>
    <!-- factory rooflines -->
    <path d="M 200 700 L 260 680 L 320 700"/>
    <path d="M 500 680 L 570 650 L 640 680"/>
    <path d="M 1100 690 L 1165 660 L 1230 690"/>
  </g>
  <!-- pencil overlap -->
  <g stroke="#9DB4CC" fill="none" opacity="0.4" stroke-width="1" stroke-linecap="round">
    <path d="M 200 702 L 260 682 L 320 702"/>
    <path d="M 500 682 L 570 652 L 640 682"/>
  </g>
</svg>
