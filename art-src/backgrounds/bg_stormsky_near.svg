<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="hatch-storm-near" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#9DB4CC" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0F2A4A"/>
  <rect width="1920" height="1080" fill="url(#grid-storm-near)" opacity="0.5">
    <defs>
      <pattern id="grid-storm-near" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 L 0 32" fill="none" stroke="#1C3F66" stroke-width="0.5"/>
      </pattern>
    </defs>
  </rect>
  <!-- near ground: storm-battered terrain, broken fences, debris -->
  <g stroke="#9DB4CC" fill="url(#hatch-storm-near)" opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ground (must tile: y(0)=y(1920)) -->
    <path d="M 0 850 C 80 830, 160 845, 240 825
             C 320 805, 400 830, 480 810
             C 560 790, 640 820, 720 800
             C 800 780, 880 810, 960 790
             C 1040 770, 1120 800, 1200 780
             C 1280 760, 1360 795, 1440 775
             C 1520 755, 1600 785, 1680 765
             C 1760 745, 1840 780, 1920 850"/>
    <!-- broken fence posts -->
    <rect x="150" y="780" width="8" height="80" opacity="0.5"/>
    <line x1="150" y1="800" x2="300" y2="795" stroke-width="1.5" opacity="0.4"/>
    <line x1="150" y1="820" x2="300" y2="815" stroke-width="1.5" opacity="0.4"/>

    <rect x="450" y="760" width="8" height="90" opacity="0.5"/>
    <line x1="450" y1="780" x2="600" y2="775" stroke-width="1.5" opacity="0.4"/>
    <line x1="450" y1="800" x2="600" y2="795" stroke-width="1.5" opacity="0.4"/>

    <rect x="750" y="790" width="8" height="70" opacity="0.5"/>
    <line x1="750" y1="810" x2="900" y2="805" stroke-width="1.5" opacity="0.4"/>

    <rect x="1050" y="770" width="8" height="80" opacity="0.5"/>
    <line x1="1050" y1="790" x2="1200" y2="785" stroke-width="1.5" opacity="0.4"/>

    <rect x="1350" y="800" width="8" height="60" opacity="0.5"/>
    <line x1="1350" y1="820" x2="1500" y2="815" stroke-width="1.5" opacity="0.4"/>

    <rect x="1650" y="785" width="8" height="75" opacity="0.5"/>
    <line x1="1650" y1="805" x2="1800" y2="800" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- heavy rain streaks -->
  <g stroke="#9DB4CC" fill="none" opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M 0 700 L 20 850"/>
    <path d="M 80 680 L 100 840"/>
    <path d="M 160 710 L 180 860"/>
    <path d="M 240 695 L 260 850"/>
    <path d="M 320 720 L 340 870"/>
    <path d="M 400 680 L 420 840"/>
    <path d="M 480 705 L 500 860"/>
    <path d="M 560 690 L 580 850"/>
    <path d="M 640 715 L 660 870"/>
    <path d="M 720 680 L 740 840"/>
    <path d="M 800 700 L 820 855"/>
    <path d="M 880 695 L 900 850"/>
    <path d="M 960 710 L 980 865"/>
    <path d="M 1040 685 L 1060 845"/>
    <path d="M 1120 705 L 1140 860"/>
    <path d="M 1200 690 L 1220 850"/>
    <path d="M 1280 715 L 1300 870"/>
    <path d="M 1360 680 L 1380 845"/>
    <path d="M 1440 700 L 1460 855"/>
    <path d="M 1520 695 L 1540 850"/>
    <path d="M 1600 710 L 1620 865"/>
    <path d="M 1680 685 L 1700 845"/>
    <path d="M 1760 705 L 1780 860"/>
    <path d="M 1840 690 L 1860 850"/>
