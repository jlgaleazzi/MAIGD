<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="hatch-el-near" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#9DB4CC" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#0F2A4A"/>
  <rect width="1920" height="1080" fill="url(#grid-el-near)" opacity="0.5">
    <defs>
      <pattern id="grid-el-near" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 L 0 32" fill="none" stroke="#1C3F66" stroke-width="0.5"/>
      </pattern>
    </defs>
  </rect>
  <!-- rubble and barricades in foreground -->
  <g stroke="#9DB4CC" fill="url(#hatch-el-near)" opacity="0.7" stroke-linecap="round" stroke-width="1.5">
    <!-- ground line (must tile: y at x=0 = y at x=1920) -->
    <path d="M 0 880 Q 160 860 320 870 Q 480 880 640 860 Q 800 840 960 855
             Q 1120 870 1280 855 Q 1440 840 1600 850 Q 1760 860 1920 880"/>
    <!-- rubble piles -->
    <path d="M 120 900 L 140 880 L 160 885 L 180 875 L 200 885 Z" opacity="0.6"/>
    <path d="M 400 920 L 420 900 L 440 905 L 460 890 L 480 910 L 500 900 Z" opacity="0.5"/>
    <path d="M 700 910 L 720 895 L 740 900 L 760 890 L 780 905 Z" opacity="0.6"/>
    <path d="M 1000 915 L 1020 895 L 1040 900 L 1060 885 L 1080 905 Z" opacity="0.5"/>
    <path d="M 1300 905 L 1320 890 L 1340 895 L 1360 880 L 1380 895 Z" opacity="0.6"/>
    <path d="M 1600 910 L 1620 895 L 1640 900 L 1660 885 L 1680 900 L 1700 895 Z" opacity="0.5"/>
    <!-- barricade walls -->
    <rect x="250" y="860" width="80" height="40" opacity="0.5"/>
    <rect x="800" y="850" width="60" height="50" opacity="0.5"/>
    <rect x="1400" y="855" width="70" height="45" opacity="0.5"/>
  </g>
  <!-- pencil overlap trace -->
  <g stroke="#9DB4CC" fill="none" opacity="0.35" stroke-width="1" stroke-linecap="round">
    <path d="M 0 882 Q 160 862 320 872 Q 480 882 640 862 Q 800 842 960 857
             Q 1120 872 1280 857 Q 1440 842 1600 852 Q 1760 862 1920 880"/>
  </g>
</svg>
