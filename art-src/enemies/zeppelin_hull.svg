<?xml version="1.0" encoding="UTF-8"?>
<!-- zeppelin_hull - Enemy airship hull with rib lines -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">

  <!-- Main hull outline (large teardrop) -->
  <g stroke="#E8F1FA" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hull top arc -->
    <path d="M780,110 C780,60 740,30 660,25
             C550,18 350,18 200,30
             C120,38 70,65 45,95 C30,115 25,120 25,120
             C25,120 30,115 45,95"/>

    <!-- Hull bottom arc -->
    <path d="M780,110 C780,160 740,190 660,195
             C550,202 350,202 200,190
             C120,182 70,155 45,125 C30,105 25,100 25,100"/>

    <!-- Horizontal spine -->
    <line x1="40" y1="110" x2="780" y2="110" stroke-width="1.5" opacity="0.4"/>

    <!-- Rib lines (vertical arcs across hull) -->
    <g stroke-width="1.5">
      <path d="M70,80 C70,95 68,115 70,140"/>
      <path d="M120,55 C120,75 118,110 120,165"/>
      <path d="M180,38 C180,60 178,110 180,182"/>
      <path d="M250,26 C250,50 248,110 250,194"/>
      <path d="M340,20 C340,45 338,110 340,200"/>
      <path d="M440,19 C440,44 438,110 440,201"/>
      <path d="M540,21 C540,46 538,110 540,199"/>
      <path d="M640,30 C640,55 638,110 640,190"/>
    </g>

    <!-- Gondola (engine car hanging under hull) -->
    <path d="M270,194 L268,220 L340,220 L338,194"/>
    <path d="M275,194 C274,200 276,210 278,220" stroke-width="2"/>
    <line x1="305" y1="194" x2="305" y2="220" stroke-width="1.5"/>

    <!-- Gondola windows -->
    <g stroke-width="1">
      <circle cx="285" cy="207" r="4"/>
      <circle cx="298" cy="207" r="4"/>
      <circle cx="311" cy="207" r="4"/>
      <circle cx="324" cy="207" r="4"/>
    </g>

    <!-- Gondola support struts -->
    <g stroke-width="1.5">
      <line x1="270" y1="194" x2="268" y2="198"/>
      <line x1="338" y1="194" x2="340" y2="198"/>
    </g>

    <!-- Tail fin -->
    <path d="M50,95 L30,30 L60,90"/>
    <path d="M50,125 L30,190 L60,130" stroke-width="2"/>

    <!-- Horizontal tail plane -->
    <path d="M40,92 L18,75 L45,95" stroke-width="2"/>
    <path d="M40,128 L18,145 L45,125" stroke-width="2"/>

    <!-- Tail fins (vertical stabilizers) -->
    <path d="M35,85 L32,50 L42,82" stroke-width="2"/>
    <path d="M35,135 L32,170 L42,138" stroke-width="2"/>

    <!-- Engine nacelles under gondola -->
    <g stroke-width="2">
      <path d="M275,220 C275,228 278,232 282,230 L285,210 C282,208 278,210 275,214"/>
      <path d="M325,220 C325,228 322,232 318,230 L315,210 C318,208 322,210 325,214"/>
    </g>

    <!-- Propeller discs on engines -->
    <ellipse cx="290" cy="220" rx="6" ry="8" stroke-dasharray="4 4" stroke-width="1.5"/>
    <ellipse cx="310" cy="220" rx="6" ry="8" stroke-dasharray="4 4" stroke-width="1.5"/>
  </g>

  <!-- Iron Cross on tail fin -->
  <g fill="#E4572E" stroke="#E8F1FA" stroke-width="0.8">
    <path d="M35,60 L36.5,60 L36.5,62 L38,62 L38,63 L36.5,63 L36.5,65 L35,65
             L35,63 L33.5,63 L33.5,62 L35,62 Z"/>
  </g>

  <!-- Dimension line callout for blueprint flavor -->
  <g stroke="#9DB4CC" opacity="0.6" stroke-width="0.8">
    <line x1="30" y1="14" x2="780" y2="14"/>
    <line x1="30" y1="11" x2="30" y2="17"/>
    <line x1="780" y1="11" x2="780" y2="17"/>
  </g>

</svg>
