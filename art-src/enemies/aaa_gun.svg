<?xml version="1.0" encoding="UTF-8"?>
<!-- aaa_gun: WWI anti-aircraft field gun, blueprint detail style. Faces right. 100x80 -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80" viewBox="0 0 100 80">
  <defs>
    <line id="spoke" x1="40" y1="60" x2="40" y2="52.5"/>
    <circle id="rivet" r="0.45"/>
    <path id="cross" d="M-0.42,-0.42 L-2.1,-3.5 L2.1,-3.5 L0.42,-0.42 L3.5,-2.1 L3.5,2.1 L0.42,0.42 L2.1,3.5 L-2.1,3.5 L-0.42,0.42 L-3.5,2.1 L-3.5,-2.1 Z"/>
  </defs>

  <g stroke="#E8F1FA" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- trail leg with spade and lunette -->
    <g id="trail">
      <path d="M30,57 L6,71" stroke-width="1.25"/>
      <path d="M33,61.5 L8,76" stroke-width="1.25"/>
      <path d="M4,69.5 L11,70.5 L10,77.5 L5,77" stroke-width="1.25"/>
      <circle cx="8" cy="73" r="1.4" stroke-width="0.75"/>
      <g stroke-width="0.5" opacity="0.8">
        <line x1="24" y1="60.5" x2="26.5" y2="64.5"/>
        <line x1="18" y1="64" x2="20.5" y2="68"/>
        <line x1="13" y1="67" x2="15" y2="71"/>
        <line x1="29" y1="59" x2="13" y2="68.5" stroke-dasharray="1 1.2"/>
      </g>
      <!-- ammunition box on trail -->
      <path d="M15,62 L23,57.5 L25,61 L17,65.5 Z" stroke-width="0.75"/>
      <line x1="16" y1="63.7" x2="24" y2="59.2" stroke-width="0.5" opacity="0.7"/>
    </g>

    <!-- front outrigger with screw jack and foot pad -->
    <g id="outrigger">
      <path d="M60,57 L87,72" stroke-width="1.25"/>
      <path d="M61,60.5 L85,74" stroke-width="0.75"/>
      <path d="M83,74 L94,74 L93,77 L84,77 Z" stroke-width="1.25"/>
      <line x1="88.5" y1="70" x2="88.5" y2="74" stroke-width="0.75"/>
      <g stroke-width="0.5" opacity="0.8">
        <line x1="68" y1="61.5" x2="67" y2="64.5"/>
        <line x1="76" y1="66" x2="75" y2="69"/>
        <line x1="85" y1="75.5" x2="92" y2="75.5"/>
      </g>
    </g>

    <!-- carriage cheek plate -->
    <g id="carriage">
      <path d="M26,56 L58,49 L66,55 L62,60 L30,63 Z" stroke-width="1.25"/>
      <line x1="29" y1="58.5" x2="60" y2="52.5" stroke-width="0.5" opacity="0.8"/>
      <g fill="#E8F1FA" stroke="none">
        <use href="#rivet" x="30" y="60.5"/>
        <use href="#rivet" x="36" y="59.8"/>
        <use href="#rivet" x="56" y="57.8"/>
        <use href="#rivet" x="61" y="56.3"/>
      </g>
      <!-- hatching on the lower cheek -->
      <g stroke-width="0.5" opacity="0.6">
        <line x1="54" y1="60.5" x2="58" y2="56"/>
        <line x1="57" y1="60.2" x2="61" y2="55.6"/>
        <line x1="27" y1="62.6" x2="29.5" y2="59.8"/>
      </g>
    </g>

    <!-- upper carriage: cheek uprights to the trunnion -->
    <g id="cradle">
      <path d="M45,51 L50,34 L58,34 L62,49.5" stroke-width="1.25"/>
      <line x1="48.5" y1="47" x2="59.5" y2="45.5" stroke-width="0.75"/>
      <line x1="50" y1="50" x2="54" y2="36" stroke-width="0.5" opacity="0.7"/>
      <line x1="58" y1="48.5" x2="55" y2="36" stroke-width="0.5" opacity="0.7"/>
      <!-- elevating arc with teeth -->
      <path d="M43.5,42 A12,12 0 0 0 49,47.3" stroke-width="0.75"/>
      <path d="M44.8,41.2 A10.5,10.5 0 0 0 49.6,45.8" stroke-width="1" stroke-dasharray="0.6 1" opacity="0.8"/>
      <!-- elevating handwheel -->
      <circle cx="29" cy="49" r="2.6" stroke-width="0.75"/>
      <line x1="26.6" y1="49" x2="31.4" y2="49" stroke-width="0.5"/>
      <line x1="29" y1="46.6" x2="29" y2="51.4" stroke-width="0.5"/>
      <line x1="31.4" y1="49.5" x2="34" y2="54.5" stroke-width="0.5" opacity="0.8"/>
    </g>

    <!-- barrel group: pivot at the trunnion, 32 degrees of elevation -->
    <g id="barrel" transform="translate(54,36) rotate(-32)">
      <!-- breech block and lever -->
      <path d="M-16,-4.5 L-6,-4.5 L-6,5.5 L-16,5.5 Z" stroke-width="1.25"/>
      <line x1="-12" y1="-4.5" x2="-12" y2="5.5" stroke-width="0.5" opacity="0.8"/>
      <circle cx="-9" cy="0.5" r="1.6" stroke-width="0.5"/>
      <path d="M-16,3 L-20,6.5" stroke-width="0.75"/>
      <circle cx="-20.5" cy="7" r="0.9" stroke-width="0.5"/>
      <!-- jacket -->
      <path d="M-6,-3.5 L20,-3 L20,3 L-6,3.5" stroke-width="1.25"/>
      <line x1="2" y1="-3.4" x2="2" y2="3.4" stroke-width="0.5"/>
      <line x1="12" y1="-3.2" x2="12" y2="3.2" stroke-width="0.5"/>
      <!-- recoil cylinder below the jacket -->
      <path d="M-4,3.5 L22,3 L22,6.2 L-4,6.6 Z" stroke-width="0.75"/>
      <line x1="-3" y1="5" x2="21" y2="4.7" stroke-width="0.5" opacity="0.6"/>
      <!-- tube and muzzle band -->
      <path d="M20,-2.2 L44,-1.7 M20,2.2 L44,1.7" stroke-width="1.25"/>
      <path d="M44,-2.4 L48,-2.4 L48,2.4 L44,2.4 Z" stroke-width="1"/>
      <line x1="-6" y1="0" x2="48" y2="0" stroke-width="0.5" stroke-dasharray="3 1.5" opacity="0.6"/>
      <!-- trunnion -->
      <circle cx="0" cy="0" r="3.2" stroke-width="0.75"/>
      <circle cx="0" cy="0" r="1.1" stroke-width="0.5"/>
      <g fill="#E8F1FA" stroke="none">
        <use href="#rivet" x="-14" y="-2.5"/>
        <use href="#rivet" x="-14" y="3.5"/>
        <use href="#rivet" x="-7.5" y="-2.5"/>
        <use href="#rivet" x="-7.5" y="3.5"/>
      </g>
    </g>

    <!-- gun shield -->
    <g id="shield">
      <path d="M62,30 L70,27 L72,52 L63,54 Z" stroke-width="1.25"/>
      <line x1="64" y1="31" x2="65" y2="52.5" stroke-width="0.5" opacity="0.7"/>
      <g stroke-width="0.5" opacity="0.6">
        <line x1="66" y1="48" x2="70" y2="44"/>
        <line x1="66.5" y1="51" x2="71" y2="46.5"/>
      </g>
    </g>

    <!-- road wheel: tyre, rim, 12 spokes, hub -->
    <g id="wheel">
      <circle cx="40" cy="63" r="13" stroke-width="1.25"/>
      <circle cx="40" cy="63" r="11.2" stroke-width="0.75"/>
      <use href="#spoke" stroke-width="0.5"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(30 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(60 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(90 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(120 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(150 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(180 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(210 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(240 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(270 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(300 40 63)"/>
      <use href="#spoke" stroke-width="0.5" transform="rotate(330 40 63)"/>
      <circle cx="40" cy="63" r="3" stroke-width="1"/>
      <circle cx="40" cy="63" r="1.1" stroke-width="0.5"/>
      <path d="M30,71 A12.2,12.2 0 0 0 46,74.3" stroke-width="0.5" opacity="0.6"/>
    </g>

    <!-- serial mark on the trail -->
    <g stroke-width="0.5" opacity="0.85">
      <path d="M11,61 L13.5,61 L12,64"/>
      <path d="M14.5,61 L17,61 L15.5,64"/>
    </g>
  </g>

  <!-- faction mark on the shield -->
  <use href="#cross" transform="translate(67.2,41) scale(1.25)" fill="#E8F1FA" stroke="#E8F1FA" stroke-width="0.4"/>
</svg>
