<?xml version="1.0" encoding="UTF-8"?>
<!-- aaa_gun - Anti-aircraft gun with angled barrel -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">

  <!-- Base platform -->
  <g stroke="#E8F1FA" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gun platform / base -->
    <path d="M30,75 L20,75 L15,68 L85,68 L80,75 L70,75"/>

    <!-- Support structure -->
    <line x1="35" y1="68" x2="30" y2="45"/>
    <line x1="65" y1="68" x2="70" y2="45"/>
    <line x1="30" y1="55" x2="70" y2="55"/>

    <!-- Pivot mount -->
    <circle cx="50" cy="45" r="6" stroke-width="2.5"/>
    <circle cx="50" cy="45" r="2" fill="#E8F1FA" stroke-width="1"/>

    <!-- Shield / armor plate -->
    <path d="M35,15 C35,10 40,5 50,5 C60,5 65,10 65,15 L62,40 C62,42 58,42 50,42
             C42,42 38,42 38,40 Z" stroke-width="2"/>

    <!-- Shield vents -->
    <g stroke-width="1.5">
      <line x1="42" y1="18" x2="42" y2="36"/>
      <line x1="50" y1="18" x2="50" y2="36"/>
      <line x1="58" y1="18" x2="58" y2="36"/>
    </g>

    <!-- Barrel (angled up-right toward enemy) -->
    <line x1="52" y1="20" x2="95" y2="10" stroke-width="4"/>
    <line x1="52" y1="20" x2="95" y2="10" stroke-width="1.5" stroke-dasharray="6 3"/>

    <!-- Muzzle flash ring -->
    <ellipse cx="97" cy="9" rx="4" ry="3" stroke-dasharray="2 2" stroke-width="1.5"/>

    <!-- Cross bracing on support -->
    <g stroke-width="1">
      <line x1="30" y1="55" x2="70" y2="68"/>
      <line x1="70" y1="55" x2="30" y2="68"/>
    </g>

    <!-- Ground spikes -->
    <g stroke-width="2">
      <line x1="15" y1="68" x2="10" y2="78"/>
      <line x1="85" y1="68" x2="90" y2="78"/>
    </g>
  </g>

</svg>
