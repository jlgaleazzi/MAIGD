<svg xmlns="http://www.w3.org/2000/svg" width="70" height="100" viewBox="0 0 70 100">
  <g id="balloon" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- balloon outline -->
    <ellipse cx="35" cy="28" rx="22" ry="26" stroke="#E8F1FA" stroke-width="2.5"/>
    <!-- inner structural line (wireframe) -->
    <line x1="35" y1="4" x2="35" y2="52" stroke="#E8F1FA" stroke-width="1.5" opacity="0.5"/>
    <ellipse cx="35" cy="28" rx="14" ry="18" stroke="#E8F1FA" stroke-width="1" opacity="0.4"/>
    <!-- tether line -->
    <line x1="35" y1="54" x2="35" y2="76" stroke="#9DB4CC" stroke-width="1.5"/>
  </g>
  <!-- heal cross on balloon -->
  <g id="cross" fill="#7BD389" stroke-linecap="round" stroke-linejoin="round">
    <rect x="27" y="20" width="16" height="4" rx="1"/>
    <rect x="32" y="15" width="6" height="14" rx="1"/>
  </g>
  <!-- small basket -->
  <g id="basket" stroke="#E8F1FA" fill="none" stroke-width="2" stroke-linejoin="round">
    <rect x="27" y="76" width="16" height="10" rx="2"/>
    <line x1="35" y1="54" x2="35" y2="76" stroke-width="1.5"/>
  </g>
</svg>
