<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <!-- Title logo: the word "Biplanes" in monoline technical lettering, built from paths
       (no <text>). Guides: cap/ascender line y70, x-height y130, baseline y210,
       descender y255. Lowercase bowls are r40 circles centred on y170. -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 L 0 32" fill="none" stroke="#1C3F66" stroke-width="1" opacity="0.5"/>
    </pattern>
    <path id="tick" d="M -4 4 L 4 -4"/>
  </defs>

  <!-- paper panel with blueprint grid -->
  <rect width="1200" height="300" fill="#0F2A4A"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- panel frame: double border and corner registration marks -->
  <g id="frame" stroke="#E8F1FA" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="1176" height="276" stroke-width="1.5" opacity="0.6"/>
    <rect x="20" y="20" width="1160" height="260" stroke-width="0.75" opacity="0.4"/>
    <path d="M 32 44 V 32 H 44 M 1156 32 H 1168 V 44 M 1168 256 V 268 H 1156 M 44 268 H 32 V 256" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- lettering guide lines (cap, x-height, baseline, descender) -->
  <g id="guides" stroke="#9DB4CC" fill="none" stroke-width="1" stroke-dasharray="6 6" opacity="0.4">
    <line x1="200" y1="70" x2="1000" y2="70"/>
    <line x1="200" y1="130" x2="1000" y2="130"/>
    <line x1="200" y1="210" x2="1000" y2="210"/>
    <line x1="200" y1="255" x2="1000" y2="255"/>
  </g>

  <!-- the word "Biplanes" -->
  <g id="title" stroke="#E8F1FA" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- B: stem, upper bowl, larger lower bowl -->
    <path id="B" d="M 258 70 V 210
                    M 258 70 H 309 A 32.5 32.5 0 0 1 309 135 H 258
                    M 309 135 H 310 A 37.5 37.5 0 0 1 310 210 H 258"/>
    <!-- i: stem and dot -->
    <path id="i1" stroke-width="4.5" d="M 378 130 V 210 M 378 96 V 104"/>
    <!-- p: stem with descender and bowl -->
    <path id="p" d="M 408 130 V 255 M 408 170 A 40 40 0 1 1 408 170.01"/>
    <!-- l: ascender stem -->
    <path id="l" d="M 518 70 V 210"/>
    <!-- a: single-storey bowl and right stem -->
    <path id="a" d="M 628 170 A 40 40 0 1 0 628 170.01 M 628 130 V 210"/>
    <!-- n: stem and arch -->
    <path id="n" d="M 658 130 V 210 M 658 170 A 40 40 0 0 1 738 170 V 210"/>
    <!-- e: bar, then the bowl open at the lower right -->
    <path id="e" d="M 768 170 H 848 A 40 40 0 1 0 836.3 198.3"/>
    <!-- s: two opposed arcs -->
    <path id="s" d="M 932 140 A 30 20 0 1 0 906 170 A 30 20 0 1 1 880 200"/>
  </g>

  <!-- blueprint callouts: overall width and cap height dimensions -->
  <g id="callouts" stroke="#E8F1FA" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.55">
    <line x1="258" y1="232" x2="258" y2="276"/>
    <line x1="936" y1="214" x2="936" y2="276"/>
    <line x1="258" y1="270" x2="936" y2="270"/>
    <use href="#tick" x="258" y="270"/>
    <use href="#tick" x="936" y="270"/>
    <line x1="210" y1="70" x2="246" y2="70"/>
    <line x1="210" y1="210" x2="246" y2="210"/>
    <line x1="220" y1="70" x2="220" y2="210"/>
    <use href="#tick" x="220" y="70"/>
    <use href="#tick" x="220" y="210"/>
    <circle cx="1000" cy="130" r="10"/>
    <path d="M 1000 116 V 144 M 986 130 H 1014"/>
  </g>
</svg>
