<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- blueprint grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 L 0 40" fill="none" stroke="#1C3F66" stroke-width="0.5" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- paper background with grid -->
  <rect width="1200" height="300" fill="#0F2A4A"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- BIPLANES title - built from paths, no text tags -->
  <g id="title" stroke="#E8F1FA" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter B -->
    <path d="M170 105 L150 105 Q140 105 140 120 Q140 135 150 138 L170 140
             L170 160 Q170 175 155 175 Q140 175 140 162
             M140 138 L170 140"/>
    <path d="M150 115 L170 117"/>
    <path d="M150 150 L170 152"/>

    <!-- Letter I -->
    <line x1="200" y1="105" x2="200" y2="175"/>
    <line x1="190" y1="105" x2="210" y2="105"/>
    <line x1="190" y1="175" x2="210" y2="175"/>

    <!-- Letter P -->
    <path d="M240 175 L240 105 Q240 98 255 98 Q275 98 275 115 Q275 132 255 132 L240 132"/>
    <path d="M255 108 Q265 108 265 118 Q265 128 255 128 L240 128"/>

    <!-- Letter I -->
    <line x1="305" y1="105" x2="305" y2="175"/>
    <line x1="295" y1="105" x2="315" y2="105"/>
    <line x1="295" y1="175" x2="315" y2="175"/>

    <!-- Letter A -->
    <path d="M340 175 L360 105 L380 175"/>
    <line x1="348" y1="150" x2="372" y2="150"/>

    <!-- Letter P -->
    <path d="M420 175 L420 105 Q420 98 435 98 Q455 98 455 115 Q455 132 435 132 L420 132"/>
    <path d="M435 108 Q445 108 445 118 Q445 128 435 128 L420 128"/>

    <!-- Letter A -->
    <path d="M490 175 L510 105 L530 175"/>
    <line x1="498" y1="150" x2="522" y2="150"/>

    <!-- Letter E -->
    <path d="M565 105 L545 105 L545 175 L565 175
             M545 130 L560 130" stroke-width="3"/>
    <line x1="545" y1="155" x2="565" y2="155" stroke-width="3"/>
  </g>

  <!-- Blueprint dimension callouts -->
  <g id="callouts" stroke="#E8F1FA" fill="none" stroke-width="1" stroke-linecap="round" opacity="0.4">
    <line x1="130" y1="200" x2="570" y2="200"/>
    <line x1="130" y1="196" x2="130" y2="204"/>
    <line x1="570" y1="196" x2="570" y2="204"/>

    <line x1="600" y1="80" x2="600" y2="210" stroke-dasharray="3 3"/>
    <circle cx="600" cy="145" r="3"/>
  </g>

  <!-- Blueprint annotation text (as small marks, not real font) -->
  <g stroke="#9DB4CC" fill="none" stroke-width="1" opacity="0.3">
    <!-- scale bar -->
    <rect x="850" y="240" width="100" height="6"/>
    <line x1="850" y1="238" x2="850" y2="248"/>
    <line x1="900" y1="238" x2="900" y2="248"/>
    <line x1="950" y1="238" x2="950" y2="248"/>
  </g>

  <!-- decorative blueprint elements -->
  <g stroke="#E8F1FA" fill="none" stroke-width="1.5" opacity="0.25">
    <!-- circular target at center -->
    <circle cx="600" cy="145" r="60"/>
    <circle cx="600" cy="145" r="45"/>
    <circle cx="600" cy="145" r="30"/>
    <line x1="540" y1="145" x2="660" y2="145"/>
    <line x1="600" y1="85" x2="600" y2="205"/>
  </g>
</svg>
