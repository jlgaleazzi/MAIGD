<?xml version="1.0" encoding="UTF-8"?>
<!-- player_hq - Player command HQ: building, sandbags, antenna mast, roundel. Blueprint detail style. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <defs>
    <pattern id="hatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="3" stroke="#E8F1FA" stroke-width="0.5" opacity="0.55"/>
    </pattern>
    <pattern id="brick" width="10" height="5" patternUnits="userSpaceOnUse">
      <path d="M0,5 L10,5 M5,0 L5,2.5 M0,2.5 L10,2.5 M0,2.5 L0,5 M10,2.5 L10,5" stroke="#E8F1FA" stroke-width="0.4" opacity="0.4" fill="none"/>
    </pattern>
    <g id="win">
      <rect x="0" y="0" width="12" height="14" stroke-width="0.75"/>
      <path d="M6,0 L6,14 M0,7 L12,7" stroke-width="0.5"/>
      <path d="M-1.5,15.5 L13.5,15.5" stroke-width="0.75"/>
      <path d="M-1,-1.5 L6,-4 L13,-1.5" stroke-width="0.5" opacity="0.8"/>
    </g>
    <path id="bag" d="M-5,0 C-5.6,-3 -4,-3.6 0,-3.6 C4,-3.6 5.6,-3 5,0 C4,0.6 -4,0.6 -5,0 Z M-2,-1.8 L2,-1.8"/>
    <path id="lat" d="M0,0 L6,-8 M6,0 L0,-8 M0,-8 L6,-8"/>
  </defs>

  <g stroke="#E8F1FA" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- GROUND -->
    <line x1="2" y1="88" x2="398" y2="88" stroke-width="1.25"/>
    <path d="M10,91 l3,-1.5 l3,1.5 M120,91 l3,-1.5 l3,1.5 M250,91 l3,-1.5 l3,1.5 M360,91 l3,-1.5 l3,1.5" stroke-width="0.5" opacity="0.6"/>
    <line x1="6" y1="94" x2="394" y2="94" stroke-width="0.5" opacity="0.35" stroke-dasharray="2 6"/>

    <!-- COMMAND BUILDING -->
    <g id="building">
      <rect x="40" y="44" width="180" height="44" fill="url(#brick)" stroke="none"/>
      <rect x="196" y="44" width="24" height="44" fill="url(#hatch)" stroke="none"/>
      <!-- walls + hip roof -->
      <path d="M40,88 L40,44 L220,44 L220,88" stroke-width="1.25"/>
      <path d="M34,45 L58,30 L202,30 L226,45 Z" stroke-width="1.25"/>
      <!-- roof framing: rafters + ridge -->
      <path d="M58,30 L58,44 M202,30 L202,44 M76,30 L72,44 M94,30 L92,44 M112,30 L111,44 M148,30 L149,44 M166,30 L168,44 M184,30 L188,44" stroke-width="0.5" opacity="0.7"/>
      <path d="M38,42.5 L222,42.5" stroke-width="0.75"/>
      <!-- chimney -->
      <path d="M182,30 L182,22 L190,22 L190,30 M181,22 L191,22" stroke-width="0.75"/>
      <path d="M183,24 L189,24 M183,26 L189,26 M183,28 L189,28" stroke-width="0.4" opacity="0.6"/>
      <!-- stone base course + cornice -->
      <path d="M40,82 L220,82" stroke-width="0.75"/>
      <path d="M40,47 L220,47" stroke-width="0.5"/>
      <!-- windows -->
      <use href="#win" x="50" y="56"/><use href="#win" x="72" y="56"/><use href="#win" x="94" y="56"/>
      <use href="#win" x="154" y="56"/><use href="#win" x="176" y="56"/><use href="#win" x="198" y="56"/>
      <!-- central porch with pediment + door -->
      <path d="M118,88 L118,56 L142,56 L142,88" stroke-width="0.75"/>
      <path d="M114,56 L130,48 L146,56 Z" stroke-width="0.75"/>
      <rect x="123" y="64" width="14" height="24" stroke-width="0.75"/>
      <path d="M130,64 L130,88 M123,76 L137,76" stroke-width="0.5"/>
      <path d="M123,64 L130,76 L137,64 M123,88 L130,76 L137,88" stroke-width="0.4" opacity="0.6"/>
      <!-- steps -->
      <path d="M120,86 L140,86 M117,88 L143,88" stroke-width="0.5"/>
      <!-- label mark "HQ" sign over door -->
      <rect x="124" y="58.5" width="12" height="4" stroke-width="0.5"/>
      <path d="M126,59.5 L126,61.5 M128,59.5 L128,61.5 M126,60.5 L128,60.5 M130.5,59.7 C129.4,59.7 129.4,61.3 130.5,61.3 C131.6,61.3 131.6,59.7 130.5,59.7 M131,61 L131.8,61.8" stroke-width="0.4"/>
    </g>

    <!-- SANDBAG WALLS -->
    <g id="sandbags" stroke-width="0.75">
      <use href="#bag" x="14" y="88"/><use href="#bag" x="25" y="88"/>
      <use href="#bag" x="19.5" y="84.4"/>
      <use href="#bag" x="236" y="88"/><use href="#bag" x="247" y="88"/><use href="#bag" x="258" y="88"/>
      <use href="#bag" x="269" y="88"/><use href="#bag" x="280" y="88"/>
      <use href="#bag" x="241.5" y="84.4"/><use href="#bag" x="252.5" y="84.4"/><use href="#bag" x="263.5" y="84.4"/>
      <use href="#bag" x="274.5" y="84.4"/>
      <use href="#bag" x="247" y="80.8"/><use href="#bag" x="258" y="80.8"/><use href="#bag" x="269" y="80.8"/>
    </g>

    <!-- ANTENNA MAST: lattice tower -->
    <g id="mast">
      <path d="M318,88 L327,10 M336,88 L327,10" stroke-width="1.25"/>
      <path d="M319.8,72 L334.2,72 M321.6,56 L332.4,56 M323.5,40 L330.5,40 M325.3,25 L328.7,25" stroke-width="0.75"/>
      <path d="M318,88 L334.2,72 M336,88 L319.8,72 M319.8,72 L332.4,56 M334.2,72 L321.6,56 M321.6,56 L330.5,40 M332.4,56 L323.5,40 M323.5,40 L328.7,25 M330.5,40 L325.3,25" stroke-width="0.5" opacity="0.8"/>
      <!-- yard arm + insulators -->
      <path d="M319,14 L335,14" stroke-width="0.75"/>
      <circle cx="319" cy="14" r="0.9" stroke-width="0.5"/><circle cx="335" cy="14" r="0.9" stroke-width="0.5"/>
      <path d="M327,10 L327,5" stroke-width="0.75"/>
      <circle cx="327" cy="4.5" r="1" stroke-width="0.5"/>
      <!-- guy wires -->
      <path d="M327,18 L296,88 M327,18 L368,88" stroke-width="0.5" opacity="0.6"/>
      <path d="M296,88 L294,88 M368,88 L370,88" stroke-width="0.75"/>
      <!-- aerial wire sagging to the building chimney -->
      <path d="M319,14 C270,26 220,24 190,22" stroke-width="0.5" opacity="0.7" stroke-dasharray="3 2"/>
      <!-- radio hut at the mast foot -->
      <rect x="342" y="72" width="22" height="16" stroke-width="1.25"/>
      <path d="M340,73 L353,66 L366,73" stroke-width="1.25"/>
      <rect x="342" y="72" width="22" height="16" fill="url(#hatch)" stroke="none"/>
      <rect x="347" y="77" width="6" height="11" stroke-width="0.5"/>
      <rect x="356" y="76" width="5" height="4" stroke-width="0.5"/>
    </g>

    <!-- DIMENSION CALLOUT above the roof -->
    <g stroke-width="0.5" opacity="0.7">
      <path d="M40,42 L40,15 M220,42 L220,15 M40,18 L220,18"/>
      <path d="M40,18 L44,16.5 M40,18 L44,19.5 M220,18 L216,16.5 M220,18 L216,19.5"/>
      <path d="M124,11 L124,13.5 L127,13.5 M126,11 L126,15 M129,11 L131.5,11 L131.5,15 L129,15 Z M133,15 L133,11 L134.5,13 L136,11 L136,15"/>
    </g>

    <!-- FACTION MARK: friendly roundel on the roof (drawn last) -->
    <g id="roundel" stroke-width="0.75">
      <circle cx="130" cy="37" r="6.5" fill="#E8F1FA"/>
      <circle cx="130" cy="37" r="4" fill="#0F2A4A"/>
      <circle cx="130" cy="37" r="1.8" fill="#E8F1FA"/>
    </g>
  </g>
</svg>
